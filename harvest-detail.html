<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harvest Details | AgriConnect AI</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .detail-card {
            max-width: 900px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 18px #00000015;
            line-height: 1.8;
        }

        .detail-card h2,
        .detail-card h3 {
            color: #236b3b;
        }

        .detail-card li {
            margin-bottom: 10px;
        }

        @media (max-width: 700px) {
            .detail-card {
                margin: 20px;
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<header class="navbar">
    <div class="logo">
        <div class="logo-icon">🌿</div>
        <div>
            <h2>AgriConnect <span>AI</span></h2>
            <small>From Seed to Sale</small>
        </div>
    </div>
    <nav>
        <a href="index.html">Home</a>
        <a href="harvest.html">Harvest</a>
    </nav>
</header>

<section class="process">
    <div class="detail-card">
        <h2 id="title">Harvest Information</h2>
        <p id="intro"></p>

        <h3>📌 Important Points</h3>
        <ul id="points"></ul>

        <h3>📝 Steps to Follow</h3>
        <ol id="steps"></ol>

        <h3>🌾 Farmer's Tip</h3>
        <p id="tip"></p>

        <a href="harvest.html" class="primary-btn">
            ← Back to Harvest
        </a>
    </div>
</section>

<script>

        "Compare plants at the same growth stage and record changes over time."
    ],

    "Leaf and Stem Inspection": [
        "🍃 Leaf and Stem Inspection",
        "Inspecting leaves and stems can help identify visible signs of pests, disease or environmental stress.",
        ["Look for spots, holes and discolouration.", "Check stems for damage or wilting.", "Inspect both sides of leaves.", "Observe whether symptoms are spreading."],
        ["Inspect plants in different areas of the field.", "Record the symptoms and take clear photos.", "Check moisture and recent weather conditions.", "Ask an expert to identify uncertain problems."],
        "Similar symptoms may have different causes, so avoid guessing a treatment."
    ],

    "Pest Monitoring": [
        "🐛 Pest Monitoring",
        "Pest monitoring helps identify insects and assess whether they are damaging the crop.",
        ["Check leaves, stems and developing produce.", "Look for eggs, insects and feeding damage.", "Record how widely the damage is spread.", "Protect beneficial insects where possible."],

        "Do not use one maturity rule for every crop."
    ],

    "Harvest Indicators": [
        "🌾 Harvest Indicators",
        "Harvest indicators help farmers determine when crops are ready to be collected.",

    ],

    "Harvest Planning": [
        "📝 Harvest Planning",
        "Harvest planning coordinates labour, equipment, transport and storage so produce can be collected efficiently.",

    "Production Records": [
        "📒 Production Records",

        "Some crops require special cleaning or should remain dry, so follow crop-specific guidance."
    ],

    "Drying and Moisture": [
        "☀️ Drying and Moisture",
        "Suitable moisture management is important for the quality and safe storage of many harvested crops, especially grains.",
        ["Required moisture levels depend on the crop.", "Drying methods differ by produce type.", "Protect produce from rain and ground moisture.", "Avoid contamination during drying."],

        "Use crop-specific moisture recommendations; do not assume every crop has the same requirement."

    "Storage Hygiene": [
        "🏠 Storage Hygiene",
        "A clean, suitable storage area helps reduce contamination, pests and post-harvest losses.",
        ["Clean the storage area before use.", "Check for leaks and unwanted moisture.", "Inspect for pests.", "Use containers suitable for the crop."],
        ["Remove old debris and clean the area.", "Inspect the roof, floor and ventilation.", "Store produce under suitable conditions.", "Inspect stored produce regularly."],

    "Transport Preparation": [
        "🚚 Transport Preparation",
        "Careful transport preparation can reduce damage and delays when moving harvested produce to a buyer or storage facility.",
        ["Choose clean, suitable containers.", "Avoid overloading containers.", "Protect produce from rain and excessive heat.", "Coordinate pickup time and destination."],
        ["Estimate the quantity to transport.", "Arrange a suitable vehicle.", "Pack produce according to its needs.", "Confirm the delivery location and timing."],
        "Fragile and perishable produce may require extra care and faster delivery."
    ]

const topic = new URLSearchParams(window.location.search).get("topic");
const data = harvestTopics[topic];

if (data) {
    document.getElementById("title").textContent = data[0];
    document.getElementById("intro").textContent = data[1];
    document.getElementById("tip").textContent = data[4];

    data[2].forEach(text => {
        const li = document.createElement("li");
        li.textContent = text;
        document.getElementById("points").appendChild(li);
    });

    data[3].forEach(text => {
        const li = document.createElement("li");
        li.textContent = text;
        document.getElementById("steps").appendChild(li);
    });
} else {
    document.getElementById("title").textContent = "Harvest Information";
    document.getElementById("intro").textContent =
        "Select a harvest sub-option from the Harvest Management page.";
    document.getElementById("tip").textContent =
        "Choose a crop-specific harvest method suitable for your region.";
}
</script>

</body>
</html>
