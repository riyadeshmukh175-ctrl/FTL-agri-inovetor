<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Registration | AgriConnect AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #edf5ee;
            padding: 20px;
        }

        .register-box {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 5px 25px #00000015;
        }

        .logo {
            text-align: center;
            font-size: 42px;
            margin-bottom: 10px;
        }

        h1 {
            color: #216b38;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #68756b;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd8ce;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #218838;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #17652b;
        }

        #message {
            margin-top: 12px;
            text-align: center;
            font-size: 14px;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #216b38;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="register-box">

        <div class="logo">🌱</div>

        <h1>AgriConnect AI</h1>

        <p class="subtitle">Company Registration</p>

        <form id="registerForm">

            <label for="companyName">Company Name</label>

            <input
                type="text"
                id="companyName"
                placeholder="Enter company name"
                required
            >

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Create password"
                required
            >

            <label for="confirmPassword">Confirm Password</label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm password"
                required
            >

            <button type="submit">
                Register
            </button>

            <p id="message"></p>

        </form>

        <a class="back-link" href="login.html">
            Already have an account? Login
        </a>

    </div>


    <script type="module">

        import { auth } from "./firebase.js";

        import {
            createUserWithEmailAndPassword
        } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


        const registerForm =
            document.getElementById("registerForm");


        registerForm.addEventListener("submit", (e) => {

            e.preventDefault();


            const companyName =
                document.getElementById("companyName").value;

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;


            if (password !== confirmPassword) {

                document.getElementById("message").textContent =
                    "Passwords do not match.";

                return;
            }


            createUserWithEmailAndPassword(
                auth,
                email,
                password
            )

            .then((userCredential) => {

                document.getElementById("message").textContent =
                    "Registration Successful!";

                alert(
                    "Company " +
                    companyName +
                    " registered successfully!"
                );

                window.location.href = "dashboard.html";

            })

            .catch((error) => {

                document.getElementById("message").textContent =
                    error.message;

            });

        });

    </script>

</body>

</html>
