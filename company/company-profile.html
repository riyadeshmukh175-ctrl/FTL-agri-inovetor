
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Profile | AgriConnect AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f3f7f3;
            color: #26352b;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        h1 {
            color: #216b38;
            margin-bottom: 8px;
        }

        .back-btn {
            background: #216b38;
            color: white;
            padding: 11px 16px;
            border-radius: 6px;
            text-decoration: none;
        }

        .profile-card {
            background: white;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000010;
        }

        .company-icon {
            width: 80px;
            height: 80px;
            background: #e1f2e4;
            color: #216b38;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            border-radius: 50%;
            margin-bottom: 15px;
        }

        h2 {
            color: #216b38;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #718074;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;
            font-size: 14px;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd8ce;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .save-btn {
            margin-top: 22px;
            padding: 12px 22px;
            background: #216b38;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .save-btn:hover {
            background: #174f29;
        }

        #message {
            margin-top: 15px;
            color: #216b38;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }
        }
    </style>
    <script type="module">
    import { auth } from "./firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

    onAuthStateChanged(auth, (user) => {
        if (!user) {
            window.location.href = "login.html";
        }
    });
</script>
</head>

<body>
    <div class="container">

        <div class="header">
            <div>
                <h1>Company Profile</h1>
                <p>Manage your company information</p>
            </div>

            <a href="dashboard.html" class="back-btn">
                Back to Dashboard
            </a>
        </div>

        <div class="profile-card">
            <div class="company-icon">🏢</div>

            <h2>Green Fresh Foods</h2>
            <p class="subtitle">AgriConnect AI Company Portal</p>

            <form id="profileForm">
                <div class="form-grid">

                    <div class="field">
                        <label for="companyName">Company Name</label>
                        <input id="companyName" type="text"
                               value="Green Fresh Foods" required>
                    </div>

                    <div class="field">
                        <label for="contactPerson">Contact Person</label>
                        <input id="contactPerson" type="text"
                               placeholder="Enter contact person" required>
                    </div>

                    <div class="field">
                        <label for="email">Company Email</label>
                        <input id="email" type="email"
                               placeholder="company@example.com" required>
                    </div>

                    <div class="field">
                        <label for="phone">Mobile Number</label>
                        <input id="phone" type="tel"
                               placeholder="Enter mobile number"
                               pattern="[0-9]{10}" required>
                    </div>

                    <div class="field">
                        <label for="businessType">Business Type</label>
                        <select id="businessType" required>
                            <option value="">Select business type</option>
                            <option>Food Processing</option>
                            <option>Agriculture Company</option>
                            <option>Wholesale Supplier</option>
                            <option>Retailer</option>
                            <option>Exporter</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="city">City</label>
                        <input id="city" type="text"
                               placeholder="Enter city" required>
                    </div>

                    <div class="field full-width">
                        <label for="address">Company Address</label>
                        <textarea id="address"
                                  placeholder="Enter complete company address"
                                  required></textarea>
                    </div>

                    <div class="field full-width">
                        <label for="description">About Company</label>
                        <textarea id="description"
                                  placeholder="Write about your company"></textarea>
                    </div>

                </div>

                <button class="save-btn" type="submit">
                    Save Profile
                </button>

                <p id="message"></p>
            </form>
        </div>
    </div>

    <script>
        document.getElementById("profileForm")
            .addEventListener("submit", function(event) {
                event.preventDefault();

                document.getElementById("message").textContent =
                    "Profile saved for this demo session!";
            });
    </script>
</body>
</html>
